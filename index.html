<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Intranet IPS Cabecera</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, calm and institutional; the quality office's own control register, not a marketing site
   IDEA: the controlled-document register of a Colombian IPS: código, versión, vigencia, all stamped and traceable
   PICTURE: the working intranet itself; the login shows the clinic's own logo and its building facade
   COLOUR and TYPE: institutional colours from the logo: royal blue #0C0C90 navigation, #1A22A6 accent, lime green #5BBF3C highlights; Inter
   LAYOUT: fixed left navigation, sticky header, content to 1240px; drawer and stacked tables below 900px */
:root{color-scheme:light dark;
--bg:light-dark(#F4F6FB,#0B0F24);--card:light-dark(#FFFFFF,#141A36);--ink:light-dark(#1C2133,#E6E9F7);--mute:light-dark(#596178,#A3AACB);
--line:light-dark(#E0E4F0,#272F55);--pri:light-dark(#1A22A6,#8F98FF);--on-pri:light-dark(#FFFFFF,#0A0D33);--pri-soft:light-dark(#ECEEFC,#1C2356);
--nav:light-dark(#0C0C90,#0A0C3A);--nav-ink:#EEF0FF;--nav-mute:#BEC3F2;--nav-act:light-dark(#2128B0,#1C2366);--acc:#5BBF3C;
--ok:light-dark(#257A1B,#7CD957);--ok-s:light-dark(#E6F5E1,#15361A);--warn:light-dark(#995400,#F2B65E);--warn-s:light-dark(#FFF1D9,#3B2A10);
--bad:light-dark(#B42318,#F48C82);--bad-s:light-dark(#FDE6E3,#3E1713);--h3:light-dark(#F7C47A,#7A5414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.15;margin:0;text-wrap:balance}h1{font-size:clamp(26px,3vw,34px);font-weight:700}h2{font-size:20px;font-weight:600}h3{font-size:16px;font-weight:600}
p{margin:0}.lead{color:var(--mute);margin-top:6px;max-width:70ch}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
.demo{background:var(--pri-soft);color:var(--pri);font-size:13px;text-align:center;padding:6px 12px;font-weight:500}
/* shell */
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--nav) 272px,transparent 272px)}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;font-size:15px}.brand span{font-size:13px;color:var(--nav-mute)}
.logo{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}.logo img{width:36px;height:36px;display:block}
.side nav{padding:12px 10px;display:grid;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--nav-ink);padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px;font-size:15px}
.nv:hover{background:rgba(255,255,255,.08)}.nv.on{background:var(--nav-act);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.subs{display:grid;gap:1px;margin:2px 0 8px 22px;padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}
.sb{background:none;border:0;text-align:left;color:var(--nav-mute);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;min-height:38px}
.sb:hover{color:#fff;background:rgba(255,255,255,.06)}.sb.on{color:#fff;background:rgba(255,255,255,.12);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.side-foot{margin-top:auto;padding:16px 18px;font-size:13px;color:var(--nav-mute);border-top:1px solid rgba(255,255,255,.12)}
.main{display:flex;flex-direction:column;min-height:100%}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px clamp(16px,3vw,32px);min-height:64px}
.crumbs{font-size:14px;color:var(--mute);display:flex;flex-wrap:nowrap;gap:6px;align-items:center;flex:1;min-width:0;overflow:hidden;white-space:nowrap}.crumbs>*{flex:none}.crumbs b{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.crumbs button{background:none;border:0;color:var(--pri);cursor:pointer;padding:2px 0}.crumbs b{color:var(--ink);font-weight:600}
.who{display:flex;align-items:center;gap:10px}.who-t{text-align:right;line-height:1.25}.who-t b{display:block;font-size:14px}.who-t span{font-size:13px;color:var(--mute)}
.content{padding:clamp(18px,3vw,36px) clamp(16px,3vw,36px);width:100%;max-width:1240px;margin:0 auto;flex:1;display:grid;gap:22px;align-content:start}
.foot{padding:18px clamp(16px,3vw,36px);font-size:13px;color:var(--mute);border-top:1px solid var(--line);text-align:center}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;text-decoration:underline;font-size:13px;padding:0}
.iconbtn.only-m{display:none}
.layout{transition:grid-template-columns .2s}.layout.noside{grid-template-columns:0 minmax(0,1fr);background:none}.layout.noside .side{visibility:hidden;overflow:hidden}
.novb{position:relative}.novc{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#D92D20;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.novp{position:fixed;top:70px;right:clamp(8px,2vw,24px);width:min(420px,calc(100vw - 16px));max-height:min(620px,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(8,10,60,.25);z-index:40;overflow:hidden}
.novp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.novp-h h2{font-size:18px}.novp-h .iconbtn{width:36px;height:36px}
.novp-b{overflow:auto;padding:6px}.novi{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:12px 30px 12px 12px;cursor:pointer;color:var(--ink);position:relative}
.novi:hover{background:var(--pri-soft)}.novi .ic{width:38px;height:38px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex:none}.novi .tx{display:grid;gap:2px;min-width:0}.novi b{font-size:14px}.novi .sb2{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.novi .dt{font-size:12px;color:var(--mute)}
.novi.new::after{content:"";position:absolute;top:16px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
@media(max-width:1180px){.crumbs>button,.crumbs>span{display:none}.who-t{display:none}}.scrim{display:none}
.btn.ic{width:36px;padding:0}.rowacts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}
.scroll th{white-space:normal;vertical-align:bottom}.scroll td:first-child{white-space:nowrap}
/* parts */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2vw,22px);box-shadow:0 1px 2px rgba(16,40,70,.05)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}.btn.sm{min-height:36px;padding:0 10px;font-size:14px}.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.badge.ok{background:var(--ok-s);color:var(--ok)}.badge.warn{background:var(--warn-s);color:var(--warn)}.badge.bad{background:var(--bad-s);color:var(--bad)}.badge.neu{background:color-mix(in srgb,var(--mute) 14%,transparent);color:var(--mute)}
.chip{font-size:12px;font-weight:600;color:var(--bad);background:var(--bad-s);border-radius:6px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.muted{color:var(--mute)}.small{font-size:14px}.ra{text-align:right;white-space:nowrap}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}.prog i{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:block}.prog i b{display:block;height:100%;background:var(--pri);border-radius:9px}.prog span{font-size:13px;font-variant-numeric:tabular-nums;width:3.2em;text-align:right}
.prog.ok i b{background:var(--ok)}.prog.warn i b{background:var(--warn)}.prog.bad i b{background:var(--bad)}
/* tables */
.tw{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;font-weight:600;color:var(--mute);background:color-mix(in srgb,var(--pri-soft) 55%,var(--card));padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--pri-soft) 35%,transparent)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}.scroll table{min-width:860px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.code{font-variant-numeric:tabular-nums;font-weight:600;color:var(--pri);white-space:nowrap}
/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.fld{display:grid;gap:5px;font-size:14px}.fld>span{font-weight:500;color:var(--mute)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical}
.filters .fld{flex:1 1 170px}.filters .fld.fq{flex:2 1 260px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri);flex:none}
/* tiles */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile .v{font-size:clamp(28px,3vw,36px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.tile .l{font-size:14px;color:var(--mute);margin-top:4px}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--warn)}.tile.bad .v{color:var(--bad)}.tile.pri .v{color:var(--pri)}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s;font:inherit;color:inherit}
.mod:hover{border-color:var(--pri);transform:translateY(-2px)}
.mod .ic{width:46px;height:46px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}.mod .ic svg{width:24px;height:24px}
.mod p{color:var(--mute);font-size:15px}.mod small{color:var(--pri);font-weight:600;font-size:14px;margin-top:auto}
.hello{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;color:#fff;border-radius:16px;padding:clamp(20px,3vw,30px);border:0;background:radial-gradient(70% 140% at 100% 100%,rgba(91,191,60,.45),rgba(91,191,60,0) 60%),linear-gradient(120deg,#0C0C90 0%,#1438B8 100%)}
.hello p{color:#D5DAFA;margin-top:6px}
/* lists */
.list{display:grid;gap:10px}.li{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.li h3{font-size:15px}.li .meta{font-size:14px;color:var(--mute)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* indicators */
.ind{display:grid;gap:8px}.ind-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ind-h h3{font-size:15px}
.ind-v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big.ok{color:var(--ok)}.big.warn{color:var(--warn)}.big.bad{color:var(--bad)}
.trend{font-size:13px;font-weight:600}.trend.ok{color:var(--ok)}.trend.bad{color:var(--bad)}.trend.neu{color:var(--mute)}
.ind-m{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--mute)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.fig{position:relative;min-height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig .gl{stroke:var(--line)}.fig .tk{fill:var(--mute);font-size:11px}.fig .goal{stroke:var(--mute);stroke-dasharray:5 4;stroke-width:1.5}
.fig .ln{fill:none;stroke:var(--pri);stroke-width:2.5;stroke-linejoin:round}.fig .pt{fill:var(--card);stroke:var(--pri);stroke-width:2}.fig .pt.bad{stroke:var(--bad)}.fig .pt.warn{stroke:var(--warn)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);flex-wrap:wrap}.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--pri);vertical-align:middle;margin-right:6px}.legend i.g{border-top:2px dashed var(--mute)}
.legend i.sq{width:12px;height:12px;border:0;border-radius:3px}
/* bars */
.bars{display:grid;gap:12px}.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 5.5em;gap:12px;align-items:center;font-size:14px}
.bar .tr{height:22px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}.bar .tr b{display:block;height:100%}
.stackbar .tr{background:transparent;gap:2px}
/* heat */
.heat{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:6px;font-size:13px}
.heat .ax{color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.heat .c{aspect-ratio:1.6;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:18px;min-height:44px}
.lv1{background:var(--ok-s);color:var(--ok)}.lv2{background:var(--warn-s);color:var(--warn)}.lv3{background:var(--h3);color:#4A2C00}.lv4{background:var(--bad);color:#fff}
.heat .c.z{opacity:.55;font-weight:500}
/* stepper */
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.step{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);align-items:flex-start}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--line);color:var(--mute)}
.step.ok .n{background:var(--ok);color:#fff}.step.warn .n{background:var(--pri);color:#fff}
.step h3{font-size:15px}.step p{font-size:13px;color:var(--mute);margin-top:4px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:500;min-height:44px}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
/* modal + toast */
.mback{position:fixed;inset:0;background:rgba(8,20,36,.5);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--card);border-radius:16px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:20px}.full{grid-column:1/-1}
.mf{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:6px}
.note{font-size:14px;background:var(--warn-s);color:var(--warn);padding:10px 12px;border-radius:10px}
.info{font-size:14px;background:var(--pri-soft);color:var(--pri);padding:12px 14px;border-radius:10px}
#toasts{position:fixed;bottom:18px;right:18px;display:grid;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 36px))}
.toast{background:#13263C;color:#fff;padding:12px 16px;border-radius:10px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:4px solid #58C890;animation:tin .2s ease-out}
.toast.bad{border-left-color:#F48C82}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}.mod{transition:none}.mod:hover{transform:none}}
/* quiz */
.q{display:grid;gap:8px;padding:16px;border:1px solid var(--line);border-radius:12px}
.q legend{font-weight:600;padding:0;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--pri)}.opt input{width:18px;height:18px;accent-color:var(--pri);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-s)}
.result{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.result .big{font-size:48px}
.mat{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;justify-content:space-between;flex-wrap:wrap}
.mat .ic{width:40px;height:40px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex:none}
.wsteps{display:flex;gap:8px;flex-wrap:wrap}.wsteps span{padding:6px 12px;border-radius:99px;font-size:14px;background:var(--line);color:var(--mute);font-weight:500}.wsteps span.on{background:var(--pri);color:var(--on-pri)}.wsteps span.done{background:var(--ok-s);color:var(--ok)}
.wq{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px}
.wrow{display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.wopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.cargos{display:flex;flex-wrap:wrap;gap:8px 18px}
/* login */
.login{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);min-height:100vh;background:var(--card)}
.l-photo{position:relative;overflow:hidden;background:#0C0C90;min-height:100vh}
.l-photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;transform:scale(1.02)}
.l-photo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(12,12,144,0) 0%,rgba(12,12,144,.05) 55%,rgba(10,10,112,.70) 72%,rgba(8,8,96,.93) 86%,rgba(8,8,92,.97) 100%),linear-gradient(90deg,rgba(12,12,144,.22),rgba(12,12,144,0) 55%)}
.l-curve{position:absolute;top:0;right:-1px;height:100%;width:clamp(70px,9vw,130px);z-index:2}

function fieldHTML(f,v){const [k,l,t,o,opt]=f;let val=v??'';
 if(t==='select')return `<label class="fld"><span>${esc(l)}</span><select name="${k}">${o.map(x=>{const [a,b,dis]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}"${String(val)===String(a)?' selected':''}${dis?' disabled':''}>${esc(b)}</option>`}).join('')}</select></label>`;
 if(t==='textarea')return `<label class="fld full"><span>${esc(l)}${opt?' <small>(opcional)</small>':''}</span><textarea name="${k}" rows="3"${opt?'':' required'}>${esc(val)}</textarea></label>`;
 if(t==='check')return `<label class="chk full"><input type="checkbox" name="${k}"${val?' checked':''}><span>${esc(l)}</span></label>`;
 if(t==='file')return `<label class="fld full"><span>${esc(l)}</span><input type="file" name="${k}" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg"></label>`;
 if(t==='note')return `<p class="note full">${esc(l)}</p>`;
 if(t==='html')return `<div class="full">${l}</div>`;
 if(t==='info')return `<p class="info full">${esc(l)}</p>`;
 if(t==='month')val=String(val).slice(0,7);
 const req=(t==='url'||opt)?'':' required';
 return `<label class="fld${t==='url'?' full':''}"><span>${esc(l)}${opt||t==='url'?' <small>(opcional)</small>':''}</span><input name="${k}" type="${t}" value="${esc(val)}"${t==='number'?' step="any" min="0"':''}${t==='password'?' autocomplete="new-password" minlength="6"':''}${req}></label>`;}

 DB.nov.filter(n=>!n.hasta||n.hasta>=today()).forEach(n=>items.push({t:n.creado,k:'nov',id:n.id,ic:'bell',tit:n.titulo,sub:n.mensaje}));
 DB.docs.filter(d=>d.est!=='Obsoleto').forEach(d=>{const c=String(d.creado||''),a=String(d.actualizado||'');
  if(c.slice(0,10)>=lim)items.push({t:c,k:'doc',id:d.id,ic:'file',tit:`Nuevo documento: ${d.cod}`,sub:d.nom});
  if(a&&a.slice(0,10)>=lim&&gt(a.slice(0,16),c.slice(0,16)))items.push({t:a,k:'doc',id:d.id,ic:'file',tit:`Documento actualizado: ${d.cod}${d.ver?' (versión '+d.ver+')':''}`,sub:d.nom})});
 DB.trainings.filter(t=>isAdmin()||(isSST()&&t.modulo==='SST')||assigned(t,S.user)).forEach(t=>{if(String(t.creado||'').slice(0,10)>=lim)items.push({t:t.creado,k:'cap',id:t.id,ic:'capacitaciones',tit:`Nueva capacitación: ${t.titulo}`,sub:t.limite?`Fecha límite ${fdr(t.limite)}`:''})});
 return items.sort((a,b)=>String(b.t).localeCompare(String(a.t))).slice(0,40)}

const assigned=(t,u)=>u.rol!=='admin'&&u.estado==='Activo'&&((t.cargos||[]).includes('Todos')||(u.cargo&&(t.cargos||[]).includes(u.cargo)));
function tStatus(t,u){const a=DB.att.filter(x=>x.cap_id===t.id&&x.uid===u.id).sort((x,y)=>x.intento-y.intento),ok=a.some(x=>x.ok),asis=DB.asis.some(x=>x.cap_id===t.id&&x.uid===u.id);
 return {a,ok,asis,used:a.length,left:Math.max(0,t.intentos-a.length),best:a.reduce((m,x)=>Math.max(m,x.nota),0),done:ok||a.length>=t.intentos}}
function myTrainings(){return DB.trainings.filter(t=>assigned(t,S.user)).map(t=>Object.assign({t},tStatus(t,S.user)))}
function capStats(L=DB.trainings){let tot=0,ok=0;L.forEach(t=>DB.users.forEach(u=>{if(assigned(t,u)){tot++;if(tStatus(t,u).ok)ok++}}));return {tot,ok,pct:pc(ok,tot)}}
const CARGOS=()=>[...new Set(DB.users.filter(u=>u.rol==='colab'&&u.cargo).map(u=>u.cargo))].sort();
const MODN=MODS.filter(m=>m.id!=='capacitaciones').map(m=>m.nom);
const capScope=()=>isAdmin()?DB.trainings:DB.trainings.filter(t=>t.modulo==='SST');
function capManage(L){const st=capStats(L);
 return `<div class="tiles"><div class="tile pri"><div class="v">${L.length}</div><div class="l">Actividades publicadas</div></div><div class="tile ${st.tot?pcls(st.pct):''}"><div class="v">${st.tot?st.pct+'%':'—'}</div><div class="l">Cumplimiento global</div></div><div class="tile"><div class="v">${st.ok} / ${st.tot}</div><div class="l">Evaluaciones aprobadas / asignadas</div></div></div>`+
  tbl(['Actividad','Módulo','Fecha límite','Dirigida a','Avance','Acciones'],L.map(t=>{const as=DB.users.filter(u=>assigned(t,u)),ok=as.filter(u=>tStatus(t,u).ok).length,v=pc(ok,as.length);
   return `<tr><td><b>${esc(t.titulo)}</b><div class="muted small">${(t.preg||[]).length} preguntas · aprueba con ${esc(t.minimo)}%${t.asistencia?' · con asistencia':''}</div></td><td>${esc(t.modulo)}</td><td>${fd(t.limite)}</td><td>${esc((t.cargos||[]).join(', '))}</td><td>${prog(v,pcls(v))}<div class="muted small">${ok} de ${as.length} aprobados</div></td><td class="ra"><div class="acts" style="justify-content:flex-end"><button class="btn sm ghost" data-act="cap-res" data-id="${t.id}">Resultados</button><button class="btn sm ghost" data-act="cap-prev" data-id="${t.id}">${ico('eye')}Vista previa</button></div></td></tr>`}),'stack','Aún no hay actividades. Use "Nueva actividad" para crear la primera.')}
function vCap(){
 if(S.sub==='new')return manager()?vWizard():vNoAuth();

 if(S.sub&&S.sub.startsWith('r:')){const t=DB.trainings.find(x=>x.id===S.sub.slice(2));return manager()&&t&&(isAdmin()||t.modulo==='SST')?vRes(t.id):vNoAuth()}

 if(isAdmin())return pageHead('Capacitaciones','Publique material educativo con evaluación y haga seguimiento al cumplimiento.',newB)+capManage(L);
 const all0=myTrainings(),pend0=all0.filter(x=>!x.done),comp0=all0.filter(x=>x.done);
 const tabs=`<div class="tabs" role="tablist"><button class="tab ${S.ctab==='pend'?'on':''}" data-act="ctab" data-id="pend">Pendientes (${pend0.length})</button><button class="tab ${S.ctab==='comp'?'on':''}" data-act="ctab" data-id="comp">Completadas (${comp0.length})</button>${isSST()?`<button class="tab ${S.ctab==='gest'?'on':''}" data-act="ctab" data-id="gest">Gestión SST (${L.length})</button>`:''}</div>`;
 const all=myTrainings(),pend=all.filter(x=>!x.done),comp=all.filter(x=>x.done),list=S.ctab==='pend'?pend:comp;
 if(S.ctab==='gest'&&isSST())return pageHead('Capacitaciones','Gestione las capacitaciones de SST y revise sus resultados.',newB)+tabs+capManage(L);
 return pageHead('Capacitaciones','Revise el material, responda la evaluación y deje su registro.')+tabs+
 (list.length?`<div class="grid w">${list.map(x=>{const venc=!x.done&&x.t.limite&&x.t.limite<today();return `<section class="card" style="display:grid;gap:10px;align-content:start"><div class="sec-h"><span class="badge neu">${esc(x.t.modulo)}</span>${x.done?badge(x.ok?'Aprobado':'No aprobado'):venc?badge('Vencida'):badge('Pendiente')}</div><h3>${esc(x.t.titulo)}</h3><p class="muted small">${esc(x.t.descr)}</p><p class="small">Fecha límite: <b>${fd(x.t.limite)}</b>${x.used?` · Intentos usados: ${x.used} de ${esc(x.t.intentos)} · Mejor nota: <b>${x.best}%</b>`:''}</p><div><button class="btn ${x.done?'ghost':'pri'}" data-act="cap-open" data-id="${x.t.id}">${x.done?'Ver detalle':x.used?'Reintentar':'Iniciar actividad'}</button></div></section>`}).join('')}</div>`:`<div class="card empty">${S.ctab==='pend'?'No tiene actividades pendientes. ¡Buen trabajo!':'Aún no ha completado actividades.'}</div>`);}
function matHTML(m){const ic=m.tipo==='Video'?'video':m.tipo==='Documento'?'file':'link';

 const btn=m.tipo==='Documento'?(d?`<button class="btn sm" data-act="doc-view" data-id="${d.id}">${ico('eye')}Abrir</button>`:'<span class="muted small">Documento no disponible</span>'):(m.url?`<a class="btn sm" href="${esc(m.url)}" target="_blank" rel="noopener">${ico('eye')}Abrir</a>`:'');

function vTake(id,preview){const t=DB.trainings.find(x=>x.id===id);if(!t){S.sub=null;return vCap()}
 const back=`<div><button class="btn ghost sm" data-act="cap-back">${ico('back')}Volver a capacitaciones</button></div>`;

 const mat=`<section class="card" style="display:grid;gap:12px"><h2>1. Material educativo</h2>${(t.material||[]).map(matHTML).join('')||'<p class="muted">Sin material.</p>'}</section>`;
 if(preview||isAdmin()){const k=(DB.claves.find(c=>c.cap_id===t.id)||{}).claves||[];
  return back+head+`<p class="info">Vista previa: así ve la actividad un colaborador. Las respuestas correctas están resaltadas (solo usted las ve).</p>`+mat+

 const st=tStatus(t,S.user),u=S.user;let res='';
 if(S.last&&S.last.tid===t.id){const L=S.last;res=`<section class="card result" style="border-color:var(--${L.ok?'ok':'bad'})"><span class="big ${L.ok?'ok':'bad'}">${L.nota}%</span><div><h2>${L.ok?'¡Aprobado!':'No aprobado'}</h2><p class="muted">${L.ok?'Su resultado quedó registrado con su nombre, cargo y fecha.':st.left?`Necesita ${esc(t.minimo)}% para aprobar. Le queda${st.left===1?'':'n'} ${st.left} intento${st.left===1?'':'s'}: revise el material y vuelva a intentarlo.`:'Agotó los intentos permitidos. Comuníquese con el área de Calidad.'}</p></div></section>`}
 const asis=t.asistencia?`<section class="card" style="display:grid;gap:10px"><h2>Registro de asistencia</h2>${st.asis?`<p>${badge('Asistencia registrada')}</p>`:`<p class="muted">Si asistió a la sesión presencial, registre su asistencia.</p><div><button class="btn" data-act="att-reg" data-id="${t.id}">${ico('check')}Registrar asistencia</button></div>`}</section>`:'';
 let quiz='';
 if(st.ok){const ap=st.a.find(a=>a.ok);quiz=`<section class="card" style="display:grid;gap:8px"><h2>2. Evaluación</h2><p>${badge('Aprobado')} Nota: <b>${ap.nota}%</b> · ${fd(ap.fecha)}</p></section>`}
 else if(!st.left)quiz=`<section class="card"><h2>2. Evaluación</h2><p class="muted" style="margin-top:8px">Agotó los ${esc(t.intentos)} intentos. Mejor nota: ${st.best}%. Comuníquese con el área de Calidad.</p></section>`;
 else quiz=`<form id="quiz" data-tid="${t.id}" class="card" style="display:grid;gap:14px" novalidate><h2>2. Evaluación de conocimientos</h2><p class="muted small">Intento ${st.used+1} de ${esc(t.intentos)} · Se registrará: ${esc(u.nombre)}${u.cargo?', '+esc(u.cargo):''}, ${fd(today())}</p>
 <label class="chk"><input type="checkbox" name="leido"><span>Confirmo que revisé el material educativo.</span></label>
 ${(t.preg||[]).map((p,k)=>`<fieldset class="q" style="margin:0"><legend>${k+1}. ${esc(p.q)}</legend>${p.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${k}" value="${j}">${esc(o)}</label>`).join('')}</fieldset>`).join('')}
 <p class="err" id="quiz-err" hidden></p><div><button class="btn pri" type="submit">${ico('check')}Enviar respuestas</button></div></form>`;
 return back+res+head+mat+quiz+asis;}
function vRes(id){const t=DB.trainings.find(x=>x.id===id);if(!t){S.sub=null;return vCap()}

 case 'confirm-yes':{const f=MF?.onYes;closeModal();if(f)f();break}
 case 'doc-new':if(canDoc())docForm();break;
 case 'doc-edit':if(canDoc())docForm(id);break;
 case 'doc-arch':if(canDoc()){const d=DB.docs.find(x=>x.id===id);openConfirm('Archivar documento',`"${d.cod} ${d.nom}" pasará a estado Obsoleto. Seguirá en el listado como registro histórico.`,async()=>{if(await dbSave('docs',{est:'Obsoleto'},d.id)){toast('Documento archivado.');render()}},'Archivar')}break;
 case 'doc-view':openDoc(id,false);break;
 case 'doc-dl':openDoc(id,true);break;
 case 'ent-new':if(can('create'))entForm(b.dataset.e,null,Object.assign({},b.dataset.c?{comite:b.dataset.c}:{},b.dataset.mod?{mod:b.dataset.mod}:{}));break;
 case 'evid':evidModal(id);break;
 case 'evid-open':openEvid(id);break;
 case 'acc-new':accForm();break;
 case 'ent-edit':if(can('edit'))entForm(b.dataset.e,id);break;
 case 'ind-upd':if(can('edit'))indForm(id);break;
 case 'ev-new':if(can('report'))openForm('Reportar evento',EVF,{fecha:today()},async v=>{
   const row=Object.assign({},v,{anon:!!v.anon,autor:v.anon?null:S.user.id});delete row.note;
   const {error}=await sb.from('eventos').insert(row);if(error){toast(errMsg(error),'bad');return false}
   await reload('eventos');toast('Reporte enviado. Gracias por contribuir a la seguridad del paciente.');render();return true},'Enviar reporte');break;
 case 'tab':S.tab=id;render();break;
 case 'flt-vig':{const sel=document.querySelector('[data-flt=vig]');if(sel&&S.repo){sel.value=id;S.repo.vig=id;updateDocs()}break}
 case 'ctab':S.ctab=id;render();break;
 case 'cap-new':S.draft=newDraft();S.wstep=1;S.sub='new';render();window.scrollTo(0,0);break;
 case 'cap-open':S.mod='capacitaciones';S.sec='actividades';S.sub='t:'+id;S.last=null;S.nav=false;render();window.scrollTo(0,0);break;
 case 'cap-prev':S.sub='p:'+id;S.last=null;render();window.scrollTo(0,0);break;
 case 'cap-res':S.sub='r:'+id;S.fres='';render();window.scrollTo(0,0);break;
 case 'cap-back':S.sub=null;S.last=null;render();window.scrollTo(0,0);break;
 case 'att-reg':{b.disabled=true;const {error}=await sb.from('asistencias').insert({cap_id:id,uid:S.user.id});if(error){b.disabled=false;toast(errMsg(error),'bad');break}await reload('asis');toast('Asistencia registrada.');render();break}
 case 'csv':{const txt=csvFor(id);const fb=()=>openForm('Resultados en formato CSV',[['info','Seleccione todo el texto, cópielo y péguelo en Excel.','info'],['csv','Resultados','textarea']],{csv:txt},async()=>true,'Cerrar');
  try{navigator.clipboard.writeText(txt).then(()=>toast('Resultados copiados. Péguelos en Excel.'),fb)}catch(x){fb()}break}
 case 'wiz-next':{const m=wizValid(S.wstep);if(m){toast(m,'bad');break}S.wstep++;render();break}
 case 'wiz-prev':if(S.wstep>1){S.wstep--;render()}break;
 case 'wiz-addmat':S.draft.material.push({tipo:'Enlace',titulo:'',url:'',doc_id:''});render();break;
 case 'wiz-delmat':S.draft.material.splice(Number(id),1);render();break;
 case 'wiz-addq':S.draft.preg.push({q:'',o:['','','',''],ok:null});render();break;
 case 'wiz-delq':S.draft.preg.splice(Number(id),1);render();break;
 case 'wiz-pub':publishWizard(b);break;
 }});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.flt!==undefined&&S.repo){S.repo[t.dataset.flt]=t.value;updateDocs();return}
 if(!S.draft)return;
 if(t.dataset.w){S.draft[t.dataset.w]=t.type==='checkbox'?t.checked:t.value}
 else if(t.dataset.wm){const [k,f]=t.dataset.wm.split('|');S.draft.material[k][f]=t.value;if(f==='tipo')render()}
 else if(t.dataset.wq){const [k,f]=t.dataset.wq.split('|'),p=S.draft.preg[k];if(f==='q')p.q=t.value;else if(f==='ok')p.ok=Number(t.value);else p.o[Number(f.slice(1))]=t.value}
 else if(t.dataset.wc!==undefined){const v=t.value;let c=S.draft.cargos.filter(x=>x!==v);if(t.checked){c=v==='Todos'?['Todos']:[...c.filter(x=>x!=='Todos'),v]}S.draft.cargos=c;document.querySelectorAll('[data-wc]').forEach(x=>x.checked=c.includes(x.value))}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.hab&&can('edit')){if(await dbSave('hab',{est:t.value},t.dataset.hab)){toast('Criterio actualizado.');render()}}
 else if(t.dataset.evst&&can('edit')){if(await dbSave('eventos',{estado:t.value},t.dataset.evst))toast('Estado del reporte actualizado.')}
 else if(t.dataset.fclas!==undefined){S.fclas=t.value;render()}
 else if(t.dataset.fres!==undefined){S.fres=t.value;render()}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
 if(f.id==='login'){const err=document.getElementById('lg-err'),btn=f.querySelector('button[type=submit]');const em=f.email.value.trim(),pw=f.pass.value;
  if(!em||!pw){err.textContent='Escriba su correo y contraseña.';err.hidden=false;return}
  btn.disabled=true;btn.textContent='Ingresando…';const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){btn.disabled=false;btn.textContent='Ingresar';err.textContent=errMsg(error);err.hidden=false;return}
  await startSession(data.session);if(S.user)toast('Bienvenido(a), '+S.user.nombre+'.');return}
 if(f.id==='mform'&&MF&&MF.fields){const v={};let miss=false;
  for(const [k,,t,,opt] of MF.fields){if(t==='note'||t==='info'||t==='html')continue;const el=f.elements[k];if(!el)continue;
   if(t==='check')v[k]=el.checked;else if(t==='file'){if(el.files&&el.files[0])v[k]=el.files[0]}
   else if(t==='number'){if(el.value===''){if(!opt)miss=true;v[k]=null}else v[k]=Number(el.value)}
   else if(t==='month'){if(!el.value)miss=true;v[k]=el.value?el.value+'-01':null}
   else{v[k]=el.value.trim();if(el.required&&!v[k])miss=true;if((t==='date'||t==='url')&&!v[k])v[k]=null}}
  if(miss){toast('Complete los campos obligatorios.','bad');return}
  const sbtn=f.querySelector('button[type=submit]');sbtn.disabled=true;const fn=MF.onSave;
  let r=false;try{r=await fn(v)}catch(x){toast(errMsg(x),'bad')}
  if(r!==false)closeModal();else sbtn.disabled=false;return}
 if(f.id==='quiz'){const t=DB.trainings.find(x=>x.id===f.dataset.tid),err=document.getElementById('quiz-err');
  if(!f.leido.checked){err.textContent='Debe confirmar que revisó el material antes de enviar.';err.hidden=false;return}
  const ans=(t.preg||[]).map((p,k)=>{const c=f.querySelector(`input[name="q${k}"]:checked`);return c?Number(c.value):null});
  if(ans.includes(null)){err.textContent='Responda todas las preguntas antes de enviar.';err.hidden=false;return}
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  const {data,error}=await sb.rpc('enviar_evaluacion',{p_cap:t.id,p_resp:ans});
  if(error){btn.disabled=false;err.textContent=errMsg(error);err.hidden=false;return}
  await reload('att');S.last={tid:t.id,nota:data.nota,ok:data.ok};render();window.scrollTo(0,0);}});
document.addEventListener('keydown',e=>{const vw=document.getElementById('viewer');
 if(vw&&vw.innerHTML){if(e.key==='Escape'){closeViewer();return}if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();toast('Este documento es de solo consulta: no se puede imprimir ni descargar.','bad');return}}
 if(e.key==='Escape'&&document.getElementById('modal').innerHTML)closeModal()});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('#viewer'))e.preventDefault()});

/* ===== Start ===== */
if(!CFG_OK){S.phase='config';render()}
else if(!sb){S.phase='nolib';render()}
else{
 if(/type=recovery/.test(location.hash))S.recovery=true;
 sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;if(S.user){S.recovery=false;askNewPassword(true)}}
  if(ev==='SIGNED_OUT'&&S.user){S.user=null;S.phase='ready';render()}});
 sb.auth.getSession().then(({data})=>startSession(data.session)).catch(()=>{S.phase='ready';render()});
}
}

</script>
</body>
</html>
